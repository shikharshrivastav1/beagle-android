import br.com.zup.beagle.Dependencies

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'de.mannodermaus.android-junit5'
apply plugin: 'kotlin-parcelize'
apply plugin: "org.jetbrains.dokka"

android {
    compileSdkVersion Dependencies.Versions.compileSdk
    buildToolsVersion Dependencies.Versions.buildTools
    testOptions.unitTests.includeAndroidResources = true

    defaultConfig {
        minSdkVersion Dependencies.Versions.minSdk
        targetSdkVersion Dependencies.Versions.targetSdk


        testInstrumentationRunner Dependencies.GeneralNames.testInstrumentationRunner
        consumerProguardFiles Dependencies.GeneralNames.consumerProguard
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    testOptions {
        unitTests.returnDefaultValues = true

        unitTests.all {
            useJUnitPlatform()
        }
    }

    lintOptions {
        checkDependencies true
        ignoreTestSources true
    }

    buildFeatures {
        viewBinding true
    }

    // Store .so files uncompressed so the system linker can mmap them
    // with proper 16KB page alignment at runtime.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    sourceSets {
        androidTest.java.srcDirs += "src/androidTest/kotlin"
        debug.java.srcDirs += "src/debug/kotlin"
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

}

dependencies {
    implementation Dependencies.AndroidxLibraries.appcompat
    implementation Dependencies.AndroidxLibraries.coreKtx
    implementation Dependencies.AndroidxLibraries.recyclerView
    implementation Dependencies.AndroidxLibraries.swipeRefreshLayout
    implementation Dependencies.AndroidxLibraries.viewModel
    implementation Dependencies.AndroidxLibraries.viewModelExtensions
    implementation Dependencies.GeneralLibraries.kotlinReflect

    implementation Dependencies.GeneralLibraries.kotlinCoroutines

    api project(Dependencies.Modules.androidAnnotation)

    kapt project(Dependencies.Modules.internalProcessor)

    implementation Dependencies.GeneralLibraries.soLoader
    implementation Dependencies.GeneralLibraries.jni

    // The patched beagle-yoga (16KB-aligned libyoga.so) is served from local-maven/
    // which takes priority over remote repositories (see root build.gradle).
    implementation Dependencies.GeneralLibraries.yoga

    implementation Dependencies.GoogleLibraries.materialDesign

    implementation Dependencies.MoshiLibraries.moshi
    implementation Dependencies.MoshiLibraries.kotlin
    implementation Dependencies.MoshiLibraries.adapters

    // Unit Testing
    testImplementation Dependencies.TestLibraries.kotlinCoroutinesTest
    testImplementation Dependencies.TestLibraries.mockk
    testImplementation Dependencies.TestLibraries.archCoreTesting
    testImplementation Dependencies.GeneralLibraries.jsonObject

    testImplementation Dependencies.TestLibraries.junitApi
    testImplementation Dependencies.TestLibraries.junitEngine
    testImplementation Dependencies.TestLibraries.junitParams
    testImplementation Dependencies.TestLibraries.junit4
    testImplementation Dependencies.TestLibraries.junitVintageEngine

    testImplementation Dependencies.TestLibraries.testRunner
    testImplementation Dependencies.TestLibraries.testExt
    testImplementation Dependencies.TestLibraries.testCore
    testImplementation Dependencies.TestLibraries.testRules
    testImplementation Dependencies.TestLibraries.robolectric
    testImplementation Dependencies.TestLibraries.fragmentTest
}

// --- Automated task: extract patched beagle-yoga jni into jniLibs before assemble ---
// This allows producing a self-contained beagle AAR that already contains
// the 16KB-aligned native libraries (libyoga.so).
task extractPatchedYogaJni(type: Copy) {
    def patched = file("$projectDir/libs/beagle-yoga-1.19.0-16k.aar")

    // Fail fast if patched AAR is missing
    doFirst {
        if (!patched.exists()) {
            throw new GradleException("Patched AAR not found: ${patched}. Run scripts/patch_yoga_16kb.py first.")
        }
    }

    from(zipTree(patched)) {
        include "jni/**"
        // strip the leading 'jni/' path segment so files land under jniLibs/<arch>/
        eachFile { details ->
            if (details.path.startsWith('jni/')) {
                details.path = details.path.substring('jni/'.length())
            }
        }
        includeEmptyDirs = false
    }

    into "$projectDir/src/main/jniLibs"

    // Always refresh destination to ensure the latest patched .so are used
    doFirst {
        delete fileTree(dir: "$projectDir/src/main/jniLibs")
    }
}

// Attach extraction to existing assemble/bundle tasks (only if they exist).
// Use findByName to avoid forcing creation/configuration of other tasks/plugins
// which can produce classpath/configuration-time failures in some environments.
afterEvaluate {
    // ensure extraction runs before assembling the AAR but only attach to
    // tasks that already exist to avoid triggering other plugins during config
    def assembleTask = tasks.findByName('assembleRelease')
    if (assembleTask != null) {
        assembleTask.dependsOn extractPatchedYogaJni
    }

    def bundleTask = tasks.findByName('bundleReleaseAar')
    if (bundleTask != null) {
        bundleTask.dependsOn extractPatchedYogaJni
    }
}

apply from: "$rootDir/maven-publish.gradle"